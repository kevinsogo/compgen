[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "KompGen"
version = "0.2"
description= "Utilities for programming contests"
authors = [
    { name = "Kevin Atienza", email = "kevin.charles.atienza@gmail.com" }
]
dependencies = [
    "natsort",
    "colorama",
    "termcolor",
    "Jinja2",
    "argcomplete",
    "pytz",
    "PyYAML",
]

[project.scripts]
kg = "kg:main"
kg-kg = "kg:main"
kg-kompgen = "kg:main"
kg-pg = "kg:main_pg"
kg-polygon = "kg:main_pg"
kg-hr = "kg:main_hr"
kg-hackerrank = "kg:main_hr"
kg-aux = "kg.script.auxilliary:main"

[tool.setuptools.packages.find]
include = [
    "kg",
    "kg.script",
    "kg.diff",
    "kg.black_magic",
    "kg.graphs",
    "kg.grids",
    "kg.utils",
    "kg.math",
]

[tool.setuptools.package-data]
kg = [
    "data/*.*",
    "data/template/*",
    "data/template/kg/*",
    "data/template/cms-it/*",
    "data/template/dom/*",
    "data/contest_template/*",
    "data/contest_template/pc2/*",
    "data/contest_template/cms-it/*",
    "data/contest_template/dom/*",
]
"kg.diff" = [
    "templates/*",
]